<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>个人博客</title>
  <meta name="author" content="">
  <meta name="description" content="一个把技术、阅读与日常写下来的个人博客。">
  <meta property="og:title" content="个人博客">
  <meta property="og:description" content="把想法写下来，让时间慢一点。">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    (function () {
      var resolved = 'light';
      try {
        var raw = localStorage.getItem('blog.content.v1');
        if (!raw) {
          for (var i = 0; i < localStorage.length; i += 1) {
            var key = localStorage.key(i);
            if (key && key.endsWith('.blog.v1')) {
              raw = localStorage.getItem(key);
              break;
            }
          }
        }
        var saved = JSON.parse(raw || 'null');
        var pref = saved && saved.ui && saved.ui.theme ? saved.ui.theme : 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        resolved = dark ? 'dark' : 'light';
      } catch (error) {}
      document.documentElement.dataset.theme = resolved;
      document.documentElement.style.colorScheme = resolved;
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#contentScroll">跳到文章内容</a>

  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="博客导航">
      <div class="brand-row">
        <button class="brand" id="brandHome" type="button" title="回到最近的文章">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span class="brand-copy">
            <span class="brand-name">Blog</span>
            <span class="brand-sub">WORDS IN MARGIN</span>
          </span>
        </button>
        <button class="icon-btn brand-collapse" id="collapseSidebarBtn" type="button" aria-label="收起侧栏" title="收起侧栏">
          <svg><use href="#i-panel-left"></use></svg>
        </button>
      </div>

      <button class="new-article-btn" id="newArticleBtn" type="button">
        <svg aria-hidden="true"><use href="#i-edit"></use></svg>
        <span>写一篇文章</span>
        <kbd>N</kbd>
      </button>

      <div class="sidebar-heading">
        <span>文章分类</span>
        <div class="heading-actions">
          <span class="heading-count" id="articleCount">0 篇</span>
          <button class="icon-btn small" id="newCategoryBtn" type="button" aria-label="新建文章分类" title="新建文章分类">
            <svg><use href="#i-folder-plus"></use></svg>
          </button>
        </div>
      </div>

      <div class="sidebar-toolbar">
        <label class="search-field" id="searchField" for="searchInput">
          <svg class="search-icon" aria-hidden="true"><use href="#i-search"></use></svg>
          <input id="searchInput" type="search" placeholder="搜索文章…" autocomplete="off" spellcheck="false" aria-label="搜索文章">
          <button class="search-clear" id="clearSearchBtn" type="button" aria-label="清除搜索" hidden>
            <svg><use href="#i-x"></use></svg>
          </button>
          <kbd class="search-kbd">/</kbd>
        </label>
        <button class="icon-btn tool-btn" id="filterBtn" type="button" aria-label="筛选文章" title="筛选文章" aria-haspopup="menu" aria-expanded="false">
          <svg><use href="#i-filter"></use></svg>
          <span class="tool-badge" id="filterBadge" hidden></span>
        </button>
        <button class="icon-btn tool-btn" id="sortBtn" type="button" aria-label="排序文章" title="排序文章" aria-haspopup="menu" aria-expanded="false">
          <svg><use href="#i-sort"></use></svg>
        </button>
      </div>

      <div class="filter-note" id="filterNote" hidden></div>

      <nav class="category-scroll" id="categoryScroll" aria-label="文章分类列表">
        <div class="category-tree" id="categoryTree"></div>
        <div class="sidebar-fade" aria-hidden="true"></div>
      </nav>

      <div class="sidebar-foot">
        <button class="theme-quick" id="themeQuickBtn" type="button" aria-label="切换主题" title="切换主题">
          <svg class="theme-icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
          <svg class="theme-icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
        </button>
        <button class="author-card" id="authorBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="博客与数据设置">
          <span class="author-avatar" aria-hidden="true"></span>
          <span class="author-copy">
            <strong></strong>
            <span>写作者 · 杭州</span>
          </span>
          <svg class="author-more" aria-hidden="true"><use href="#i-more"></use></svg>
        </button>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

    <main class="main" id="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn nav-toggle" id="navToggle" type="button" aria-label="打开侧栏" title="打开侧栏" aria-expanded="false">
            <svg><use href="#i-menu"></use></svg>
          </button>
          <nav class="breadcrumbs" id="breadcrumbs" aria-label="面包屑导航"></nav>
        </div>
        <div class="topbar-actions">
          <span class="reading-chip" id="readingChip"></span>
          <button class="ghost-btn edit-btn" id="editArticleBtn" type="button">
            <svg aria-hidden="true"><use href="#i-edit"></use></svg>
            <span>编辑</span>
          </button>
          <button class="icon-btn" id="shareArticleBtn" type="button" aria-label="复制文章链接" title="复制文章链接">
            <svg><use href="#i-share"></use></svg>
          </button>
          <button class="icon-btn" id="articleMenuBtn" type="button" aria-label="更多文章操作" title="更多操作" aria-haspopup="menu" aria-expanded="false">
            <svg><use href="#i-more"></use></svg>
          </button>
        </div>
      </header>

      <div class="reading-track" aria-hidden="true"><div class="reading-track-bar" id="readingBar"></div></div>

      <section class="content-scroll" id="contentScroll" tabindex="-1">
        <div class="article-stage" id="articleStage">
          <div class="article-skeleton" aria-hidden="true">
            <div class="skeleton-bubble"></div>
            <div class="skeleton-avatar"></div>
            <div class="skeleton-lines">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>
        <div class="scroll-end-space" aria-hidden="true"></div>
      </section>

      <div class="reader-dock-wrap" id="readerDockWrap">
        <div class="reader-dock" role="navigation" aria-label="文章导航">
          <button class="dock-nav" id="prevArticleBtn" type="button">
            <svg aria-hidden="true"><use href="#i-arrow-left"></use></svg>
            <span>上一篇</span>
          </button>
          <div class="dock-progress">
            <span id="dockPosition">01 / 01</span>
            <div class="dock-track" aria-hidden="true"><i id="dockBar"></i></div>
          </div>
          <button class="dock-nav dock-next" id="nextArticleBtn" type="button">
            <span>下一篇</span>
            <svg aria-hidden="true"><use href="#i-arrow-right"></use></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <div id="menuRoot" class="menu-root"></div>
  <div id="modalRoot" class="modal-root"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <input id="importFile" type="file" accept="application/json,.json" aria-label="导入博客备份" hidden>

  <noscript>
    <div class="noscript-card">这个博客需要 JavaScript 才能呈现文章与交互。请启用 JavaScript 后重新打开。</div>
  </noscript>

  <script src="assets/site-config.js" defer></script>
  <script src="assets/data.js" defer></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
